<!DOCTYPE html>
<html lang="zh-TW" style="background:#ffffff;color-scheme:light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>收貨人管理</title>
<style>
:root {
  --cyan:  #1a7bbf;
  --amber: #c07000;
  --red:   #cc2222;
  --green: #2e9e5b;
  --txt:   #111111;
  --txt2:  #444444;
  --mono: 'SF Mono','Menlo','Consolas','Courier New',monospace;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent }
html, body { overflow-x:hidden; font-size:16px }
body {
  background:#ffffff !important; color:#111111 !important;
  font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}

/* ── TOP BAR ── */
#top {
  position:sticky; top:0; z-index:200;
  background:#f2f4f6; border-bottom:2px solid var(--cyan);
  padding:10px 14px;
}
.bar1 { display:flex; align-items:center; justify-content:space-between; gap:8px }
.app-title { font-size:.95rem; font-weight:900; letter-spacing:2px; color:#1a5a8a }
.tbtn {
  border:1px solid rgba(0,0,0,.2); border-radius:6px; padding:7px 12px;
  font-size:.78rem; font-weight:700; cursor:pointer; font-family:inherit;
  background:#ffffff; color:#333333; white-space:nowrap;
}
.tbtn-primary { border-color:var(--cyan); color:var(--cyan); background:rgba(26,123,191,.06) }

/* ── MAIN ── */
main { padding:16px }

.empty {
  text-align:center; padding:60px 20px; color:#777777; font-size:.9rem; line-height:2;
}
.empty .ico { font-size:2.2rem; margin-bottom:10px }

/* ── LIST ── */
.consignee-card {
  background:#ffffff; border:1px solid rgba(0,0,0,.12); border-radius:10px;
  padding:14px 16px; margin-bottom:10px;
  display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
}
.cc-info { flex:1; min-width:0 }
.cc-name { font-size:.95rem; font-weight:800; color:var(--txt); margin-bottom:4px; word-break:break-word }
.cc-meta { display:flex; gap:12px; font-size:.75rem; color:var(--txt2); margin-bottom:6px; flex-wrap:wrap }
.cc-meta b { color:var(--cyan); font-weight:800 }
.cc-address { font-size:.72rem; color:#888888; line-height:1.5; white-space:pre-wrap; word-break:break-word }
.cc-actions { display:flex; flex-direction:column; gap:6px; flex-shrink:0 }
.cc-btn {
  border:1px solid rgba(0,0,0,.15); border-radius:6px; padding:6px 10px;
  font-size:.7rem; font-weight:700; cursor:pointer; font-family:inherit;
  background:#ffffff; white-space:nowrap;
}
.cc-btn-edit { color:var(--cyan); border-color:rgba(26,123,191,.3) }
.cc-btn-del  { color:var(--red); border-color:rgba(204,34,34,.3) }

/* ── DIALOG ── */
.dlg-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.5);
  z-index:400; display:none; align-items:center; justify-content:center; padding:20px;
}
.dlg-overlay.show { display:flex }
.dlg-box {
  background:#ffffff; border:1px solid rgba(0,0,0,.15); border-radius:12px;
  padding:22px 20px 18px; max-width:360px; width:100%;
  box-shadow:0 8px 32px rgba(0,0,0,.18);
  max-height:88vh; overflow-y:auto;
}
.dlg-box h3 { font-size:.95rem; font-weight:800; color:#111111; margin-bottom:16px }
.field { margin-bottom:14px; text-align:left }
.field label {
  display:block; font-size:.72rem; font-weight:700; color:#444444;
  letter-spacing:.5px; margin-bottom:6px;
}
.field input, .field textarea {
  width:100%; padding:10px 12px; border:1.5px solid rgba(0,0,0,.15);
  border-radius:8px; font-size:.88rem; font-family:inherit; color:#111111;
  outline:none; background:#ffffff;
}
.field textarea { resize:vertical; min-height:70px; line-height:1.5 }
.field input:focus, .field textarea:focus { border-color:var(--cyan) }
.field-hint { font-size:.68rem; color:#999999; margin-top:4px }

.dlg-error { color:var(--red); font-size:.75rem; font-weight:600; min-height:18px; margin-bottom:6px }

.dlg-btns { display:flex; gap:8px; margin-top:6px }
.dlg-cancel {
  flex:1; padding:10px; background:none; border:1px solid rgba(0,0,0,.2);
  color:#555555; border-radius:8px; font-size:.85rem; cursor:pointer; font-family:inherit;
}
.dlg-ok {
  flex:1; padding:10px; background:var(--cyan); color:#fff; border:none;
  border-radius:8px; font-size:.85rem; font-weight:800; cursor:pointer; font-family:inherit;
}
.dlg-ok.danger { background:var(--red) }

.fab {
  position:fixed; bottom:24px; right:20px; z-index:150;
  width:52px; height:52px; border-radius:50%;
  background:var(--cyan); color:#fff; border:none;
  font-size:1.5rem; cursor:pointer;
  box-shadow:0 4px 14px rgba(26,123,191,.4);
  display:flex; align-items:center; justify-content:center;
}

.toast {
  position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(8px);
  background:#1a7bbf; border:1px solid #1a7bbf; color:#fff;
  padding:9px 18px; border-radius:20px; font-size:.78rem; font-weight:700;
  opacity:0; transition:all .25s; pointer-events:none; z-index:600; white-space:nowrap;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0) }
.toast.warn { background:var(--amber); border-color:var(--amber) }
</style>
</head>
<body>

<div id="top">
  <div class="bar1">
    <span class="app-title">收貨人管理</span>
    <button class="tbtn" onclick="location.href='console.html'">🏠 回到首頁</button>
  </div>
</div>

<main>
  <div id="list"></div>
</main>

<button class="fab" onclick="openAdd()">＋</button>

<!-- ════ ADD/EDIT DIALOG ════ -->
<div class="dlg-overlay" id="dlg-edit">
  <div class="dlg-box">
    <h3 id="dlg-title">新增收貨人</h3>

    <div class="field">
      <label>收貨人名稱 *</label>
      <input type="text" id="f-name" placeholder="需與 Excel「收货人」欄位完全一致">
      <div class="field-hint">名稱需與原始 Excel 裡的「收货人」欄位完全相同，才能自動比對</div>
    </div>

    <div class="field">
      <label>艙號起始值 *</label>
      <input type="number" id="f-seal" placeholder="例如 5501">
      <div class="field-hint">系統會依提單號順序，從這個號碼開始遞增</div>
    </div>

    <div class="field">
      <label>標準英文地址</label>
      <textarea id="f-address" placeholder="例如：9F.-1, No. 268, Sec. 2, Fuxing S. Rd., Da'an Dist., Taipei City 10663, Taiwan"></textarea>
    </div>

    <div class="dlg-error" id="dlg-error"></div>

    <div class="dlg-btns">
      <button class="dlg-cancel" onclick="closeDlg()">取消</button>
      <button class="dlg-ok" id="dlg-submit" onclick="submitForm()">儲存</button>
    </div>
  </div>
</div>

<!-- ════ DELETE CONFIRM ════ -->
<div class="dlg-overlay" id="dlg-delete">
  <div class="dlg-box" style="text-align:center">
    <h3>🗑 刪除收貨人</h3>
    <p style="font-size:.8rem;color:#444444;margin-bottom:16px" id="delete-text">確定要刪除嗎？</p>
    <div class="dlg-btns">
      <button class="dlg-cancel" onclick="closeDeleteDlg()">取消</button>
      <button class="dlg-ok danger" onclick="doDelete()">確定刪除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://ruziacdggdfyvlbcjnan.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1emlhY2RnZ2RmeXZsYmNqbmFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NzE1OTEsImV4cCI6MjEwMDQ0NzU5MX0.3P7SzY2EfKtUTcuaBB0fMY0FOIdp_X3KmkfRnL8wuSg';

// 登入保護
(function checkAuth() {
  const saved = localStorage.getItem('ctr-auth') || sessionStorage.getItem('ctr-auth');
  if (!saved) { window.location.replace('index.html'); return; }
  try {
    const auth = JSON.parse(saved);
    if (!auth || !auth.username) throw new Error('invalid');
    window._currentUser = auth.username;
  } catch(e) {
    window.location.replace('index.html');
  }
})();

let consignees = [];
let editingId = null;
let pendingDeleteId = null;

async function loadConsignees() {
  try {
    const res = await fetch(`${SB_URL}/rest/v1/consignees?select=*&order=name.asc`, {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    if (!res.ok) throw new Error('連線失敗');
    consignees = await res.json();
    render();
  } catch(e) {
    document.getElementById('list').innerHTML = '<div class="empty">⚠️ 載入失敗，請檢查網路連線</div>';
  }
}

function render() {
  const listEl = document.getElementById('list');
  if (!consignees.length) {
    listEl.innerHTML = `<div class="empty">
      <div class="ico">📇</div>
      尚未有收貨人資料<br>
      <span style="font-size:.78rem">點右下角「＋」新增第一筆</span>
    </div>`;
    return;
  }

  listEl.innerHTML = consignees.map(c => `
    <div class="consignee-card">
      <div class="cc-info">
        <div class="cc-name">${escapeHtml(c.name)}</div>
        <div class="cc-meta"><span>艙號起始：<b>${c.seal_start}</b></span></div>
        ${c.address ? `<div class="cc-address">${escapeHtml(c.address)}</div>` : '<div class="cc-address" style="color:#cc8800">尚未設定地址</div>'}
      </div>
      <div class="cc-actions">
        <button class="cc-btn cc-btn-edit" onclick="openEdit('${c.id}')">編輯</button>
        <button class="cc-btn cc-btn-del" onclick="askDelete('${c.id}')">刪除</button>
      </div>
    </div>`).join('');
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}

/* ══ ADD / EDIT ══ */
function openAdd() {
  editingId = null;
  document.getElementById('dlg-title').textContent = '新增收貨人';
  document.getElementById('f-name').value = '';
  document.getElementById('f-seal').value = '';
  document.getElementById('f-address').value = '';
  document.getElementById('dlg-error').textContent = '';
  document.getElementById('dlg-edit').classList.add('show');
}

function openEdit(id) {
  const c = consignees.find(x => x.id === id);
  if (!c) return;
  editingId = id;
  document.getElementById('dlg-title').textContent = '編輯收貨人';
  document.getElementById('f-name').value = c.name;
  document.getElementById('f-seal').value = c.seal_start;
  document.getElementById('f-address').value = c.address || '';
  document.getElementById('dlg-error').textContent = '';
  document.getElementById('dlg-edit').classList.add('show');
}

function closeDlg() {
  document.getElementById('dlg-edit').classList.remove('show');
}

async function submitForm() {
  const name = document.getElementById('f-name').value.trim();
  const seal = document.getElementById('f-seal').value.trim();
  const address = document.getElementById('f-address').value.trim();
  const errEl = document.getElementById('dlg-error');
  const btnEl = document.getElementById('dlg-submit');

  if (!name) { errEl.textContent = '請輸入收貨人名稱'; return; }
  if (!seal || isNaN(parseInt(seal))) { errEl.textContent = '請輸入有效的艙號起始值'; return; }

  errEl.textContent = '';
  btnEl.textContent = '儲存中…';
  btnEl.disabled = true;

  try {
    const payload = { name, seal_start: parseInt(seal), address };

    if (editingId) {
      const res = await fetch(`${SB_URL}/rest/v1/consignees?id=eq.${editingId}`, {
        method: 'PATCH',
        headers: {
          'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
          'Content-Type': 'application/json', 'Prefer': 'return=minimal'
        },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error(await res.text());
    } else {
      const res = await fetch(`${SB_URL}/rest/v1/consignees`, {
        method: 'POST',
        headers: {
          'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
          'Content-Type': 'application/json', 'Prefer': 'return=minimal'
        },
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        const errText = await res.text();
        if (errText.includes('duplicate') || errText.includes('unique')) {
          throw new Error('這個收貨人名稱已經存在');
        }
        throw new Error(errText);
      }
    }

    closeDlg();
    await loadConsignees();
    toast(editingId ? '✅ 已更新收貨人' : '✅ 已新增收貨人');
  } catch(e) {
    errEl.textContent = '儲存失敗：' + (e.message || '請稍後再試');
  } finally {
    btnEl.textContent = '儲存';
    btnEl.disabled = false;
  }
}

/* ══ DELETE ══ */
function askDelete(id) {
  const c = consignees.find(x => x.id === id);
  if (!c) return;
  pendingDeleteId = id;
  document.getElementById('delete-text').textContent = `確定要刪除「${c.name}」嗎？此動作無法復原。`;
  document.getElementById('dlg-delete').classList.add('show');
}

function closeDeleteDlg() {
  document.getElementById('dlg-delete').classList.remove('show');
  pendingDeleteId = null;
}

async function doDelete() {
  if (!pendingDeleteId) return;
  const id = pendingDeleteId;
  closeDeleteDlg();

  try {
    const res = await fetch(`${SB_URL}/rest/v1/consignees?id=eq.${id}`, {
      method: 'DELETE',
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    if (!res.ok) throw new Error('刪除失敗');
    await loadConsignees();
    toast('🗑 已刪除');
  } catch(e) {
    toast('⚠️ 刪除失敗，請稍後再試', true);
  }
}

/* ══ TOAST ══ */
function toast(msg, warn=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (warn ? ' warn' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2400);
}

loadConsignees();
</script>
</body>
</html>
