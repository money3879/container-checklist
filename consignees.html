<!DOCTYPE html>
<html lang="zh-TW" style="background:#ffffff;color-scheme:light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>收貨人管理</title>
<style>
:root {
  --cyan:  #1a7bbf;
  --amber: #c07000;
  --red:   #cc2222;
  --green: #2e9e5b;
  --txt:   #111111;
  --txt2:  #444444;
  --mono: 'SF Mono','Menlo','Consolas','Courier New',monospace;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent }
html, body { overflow-x:hidden; font-size:16px }
body {
  background:#ffffff !important; color:#111111 !important;
  font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}

/* ── TOP BAR ── */
#top {
  position:sticky; top:0; z-index:200;
  background:#f2f4f6; border-bottom:2px solid var(--cyan);
  padding:10px 14px;
}
.bar1 { display:flex; align-items:center; justify-content:space-between; gap:8px }
.app-title { font-size:.95rem; font-weight:900; letter-spacing:2px; color:#1a5a8a }
.tbtn {
  border:1px solid rgba(0,0,0,.2); border-radius:6px; padding:7px 12px;
  font-size:.78rem; font-weight:700; cursor:pointer; font-family:inherit;
  background:#ffffff; color:#333333; white-space:nowrap;
}

/* ── MAIN ── */
main { padding:16px; padding-bottom:90px }

.empty {
  text-align:center; padding:60px 20px; color:#777777; font-size:.9rem; line-height:2;
}
.empty .ico { font-size:2.2rem; margin-bottom:10px }

/* ── CONSIGNEE CARD (grouped by name) ── */
.consignee-card {
  background:#ffffff; border:1px solid rgba(0,0,0,.12); border-radius:10px;
  padding:14px 16px; margin-bottom:10px;
}
.cc-header {
  display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid rgba(0,0,0,.08);
  flex-wrap:wrap;
}
.cc-name { font-size:.95rem; font-weight:800; color:var(--txt); word-break:break-word }
.cc-address { font-size:.72rem; color:#888888; line-height:1.5; white-space:pre-wrap; word-break:break-word; margin-top:4px }
.cc-header-btn {
  border:1px solid rgba(0,0,0,.15); border-radius:6px; padding:5px 9px;
  font-size:.68rem; font-weight:700; cursor:pointer; font-family:inherit;
  background:#ffffff; color:var(--cyan); white-space:nowrap; flex-shrink:0;
}

/* location rows within a card */
.loc-row {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:8px 10px; border-radius:7px; background:#f8f9fa; margin-bottom:6px;
  flex-wrap:wrap;
}
.loc-row:last-child { margin-bottom:0 }
.loc-info { font-size:.8rem; color:var(--txt); flex:1 1 auto; min-width:0; word-break:break-word; line-height:1.6 }
.loc-info b { color:var(--cyan); font-family:var(--mono) }
.loc-actions { display:flex; gap:5px; flex-shrink:0 }
.loc-btn {
  border:none; border-radius:5px; padding:4px 8px;
  font-size:.65rem; font-weight:700; cursor:pointer; font-family:inherit;
  background:none;
}
.loc-btn-edit { color:var(--cyan) }
.loc-btn-del  { color:var(--red) }

.add-loc-btn {
  width:100%; margin-top:8px; padding:8px;
  border:1.5px dashed rgba(0,0,0,.2); border-radius:7px;
  background:none; color:var(--cyan); font-size:.75rem; font-weight:700;
  cursor:pointer; font-family:inherit;
}

/* ── DIALOG ── */
.dlg-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.5);
  z-index:400; display:none; align-items:center; justify-content:center; padding:20px;
}
.dlg-overlay.show { display:flex }
.dlg-box {
  background:#ffffff; border:1px solid rgba(0,0,0,.15); border-radius:12px;
  padding:22px 20px 18px; max-width:360px; width:100%;
  box-shadow:0 8px 32px rgba(0,0,0,.18);
  max-height:88vh; overflow-y:auto;
}
.dlg-box h3 { font-size:.95rem; font-weight:800; color:#111111; margin-bottom:16px }
.field { margin-bottom:14px; text-align:left }
.field label {
  display:block; font-size:.72rem; font-weight:700; color:#444444;
  letter-spacing:.5px; margin-bottom:6px;
}
.field input, .field textarea {
  width:100%; padding:10px 12px; border:1.5px solid rgba(0,0,0,.15);
  border-radius:8px; font-size:.88rem; font-family:inherit; color:#111111;
  outline:none; background:#ffffff;
}
.field textarea { resize:vertical; min-height:70px; line-height:1.5 }
.field input:focus, .field textarea:focus { border-color:var(--cyan) }
.field-hint { font-size:.68rem; color:#999999; margin-top:4px }
.field input:disabled { background:#f0f0f0; color:#888888 }

.dlg-error { color:var(--red); font-size:.75rem; font-weight:600; min-height:18px; margin-bottom:6px }

.dlg-btns { display:flex; gap:8px; margin-top:6px }
.dlg-cancel {
  flex:1; padding:10px; background:none; border:1px solid rgba(0,0,0,.2);
  color:#555555; border-radius:8px; font-size:.85rem; cursor:pointer; font-family:inherit;
}
.dlg-ok {
  flex:1; padding:10px; background:var(--cyan); color:#fff; border:none;
  border-radius:8px; font-size:.85rem; font-weight:800; cursor:pointer; font-family:inherit;
}
.dlg-ok.danger { background:var(--red) }

.fab {
  position:fixed; bottom:24px; right:20px; z-index:150;
  width:52px; height:52px; border-radius:50%;
  background:var(--cyan); color:#fff; border:none;
  font-size:1.5rem; cursor:pointer;
  box-shadow:0 4px 14px rgba(26,123,191,.4);
  display:flex; align-items:center; justify-content:center;
}

.toast {
  position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(8px);
  background:#1a7bbf; border:1px solid #1a7bbf; color:#fff;
  padding:9px 18px; border-radius:20px; font-size:.78rem; font-weight:700;
  opacity:0; transition:all .25s; pointer-events:none; z-index:600; white-space:nowrap;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0) }
.toast.warn { background:var(--amber); border-color:var(--amber) }
</style>
</head>
<body>

<div id="top">
  <div class="bar1">
    <span class="app-title">收貨人管理</span>
    <button class="tbtn" onclick="location.href='manifest.html'">← 返回艙單系統</button>
  </div>
</div>

<main>
  <div id="list"></div>
</main>

<button class="fab" onclick="openAddConsignee()">＋</button>

<!-- ════ ADD CONSIGNEE (new name + first location) ════ -->
<div class="dlg-overlay" id="dlg-add-consignee">
  <div class="dlg-box">
    <h3>新增收貨人</h3>

    <div class="field">
      <label>收貨人名稱 *</label>
      <input type="text" id="nc-name" placeholder="需與 Excel「收货人」欄位完全一致">
      <div class="field-hint">英文名稱需與原始 Excel 裡的「收货人」欄位完全相同，才能自動比對</div>
    </div>

    <div class="field">
      <label>中文全名</label>
      <input type="text" id="nc-chinesename" placeholder="例如：捷豐國際物流股份有限公司">
      <div class="field-hint">用於 T1「收貨人 (中/英文公司名稱)」的中文名稱</div>
    </div>

    <div class="field">
      <label>標準英文地址</label>
      <textarea id="nc-address" placeholder="例如：9F.-1, No. 268, Sec. 2, Fuxing S. Rd., Da'an Dist., Taipei City 10663, Taiwan"></textarea>
    </div>

    <div class="field">
      <label>統一編號</label>
      <input type="text" id="nc-taxid" placeholder="例如：24951752">
    </div>

    <div class="field">
      <label>聯絡人資訊</label>
      <textarea id="nc-contact" placeholder="例如：2 25148667&#10;WU,JIA-HUA" style="min-height:56px"></textarea>
      <div class="field-hint">可多行輸入，會自動保留換行</div>
    </div>

    <div class="field">
      <label>中文簡稱</label>
      <input type="text" id="nc-shortname" placeholder="例如：捷豐">
      <div class="field-hint">用於艙單內部欄位，簡短即可</div>
    </div>

    <div class="field">
      <label>卸存地 *</label>
      <input type="text" id="nc-location" placeholder="例如 KHH0638S" style="text-transform:uppercase">
    </div>

    <div class="field">
      <label>艙號起始值 *</label>
      <input type="number" id="nc-seal" placeholder="例如 5501">
      <div class="field-hint">系統會依提單號順序，從這個號碼開始遞增</div>
    </div>

    <div class="field">
      <label>件數單位</label>
      <select id="nc-unit" style="width:100%;padding:10px 12px;border:1.5px solid rgba(0,0,0,.15);border-radius:8px;font-size:.88rem;font-family:inherit;color:#111111;outline:none;background:#ffffff">
        <option value="PKG">PKG</option>
        <option value="CTN">CTN</option>
      </select>
      <div class="field-hint">大部分收貨人用 PKG，少數用 CTN</div>
    </div>

    <div class="dlg-error" id="nc-error"></div>

    <div class="dlg-btns">
      <button class="dlg-cancel" onclick="closeDlg('dlg-add-consignee')">取消</button>
      <button class="dlg-ok" id="nc-submit" onclick="submitNewConsignee()">儲存</button>
    </div>
  </div>
</div>

<!-- ════ EDIT CONSIGNEE INFO (name + address only) ════ -->
<div class="dlg-overlay" id="dlg-edit-consignee">
  <div class="dlg-box">
    <h3>編輯收貨人資訊</h3>

    <div class="field">
      <label>收貨人名稱 *</label>
      <input type="text" id="ec-name">
    </div>

    <div class="field">
      <label>中文全名</label>
      <input type="text" id="ec-chinesename" placeholder="例如：捷豐國際物流股份有限公司">
      <div class="field-hint">用於 T1「收貨人 (中/英文公司名稱)」的中文名稱</div>
    </div>

    <div class="field">
      <label>標準英文地址</label>
      <textarea id="ec-address"></textarea>
    </div>

    <div class="field">
      <label>統一編號</label>
      <input type="text" id="ec-taxid">
    </div>

    <div class="field">
      <label>聯絡人資訊</label>
      <textarea id="ec-contact" style="min-height:56px"></textarea>
      <div class="field-hint">可多行輸入，會自動保留換行</div>
    </div>

    <div class="field">
      <label>中文簡稱</label>
      <input type="text" id="ec-shortname" placeholder="例如：捷豐">
    </div>

    <div class="dlg-error" id="ec-error"></div>

    <div class="dlg-btns">
      <button class="dlg-cancel" onclick="closeDlg('dlg-edit-consignee')">取消</button>
      <button class="dlg-ok" id="ec-submit" onclick="submitEditConsignee()">儲存</button>
    </div>
  </div>
</div>

<!-- ════ ADD/EDIT LOCATION (within a consignee) ════ -->
<div class="dlg-overlay" id="dlg-loc">
  <div class="dlg-box">
    <h3 id="loc-title">新增卸存地</h3>

    <div class="field">
      <label>卸存地 *</label>
      <input type="text" id="loc-location" placeholder="例如 KHH0638S" style="text-transform:uppercase">
    </div>

    <div class="field">
      <label>艙號起始值 *</label>
      <input type="number" id="loc-seal" placeholder="例如 5501">
    </div>

    <div class="field">
      <label>件數單位</label>
      <select id="loc-unit" style="width:100%;padding:10px 12px;border:1.5px solid rgba(0,0,0,.15);border-radius:8px;font-size:.88rem;font-family:inherit;color:#111111;outline:none;background:#ffffff">
        <option value="PKG">PKG</option>
        <option value="CTN">CTN</option>
      </select>
    </div>

    <div class="dlg-error" id="loc-error"></div>

    <div class="dlg-btns">
      <button class="dlg-cancel" onclick="closeDlg('dlg-loc')">取消</button>
      <button class="dlg-ok" id="loc-submit" onclick="submitLocation()">儲存</button>
    </div>
  </div>
</div>

<!-- ════ DELETE CONFIRM ════ -->
<div class="dlg-overlay" id="dlg-delete">
  <div class="dlg-box" style="text-align:center">
    <h3 id="delete-title">🗑 確認刪除</h3>
    <p style="font-size:.8rem;color:#444444;margin-bottom:16px" id="delete-text">確定要刪除嗎？</p>
    <div class="dlg-btns">
      <button class="dlg-cancel" onclick="closeDlg('dlg-delete')">取消</button>
      <button class="dlg-ok danger" onclick="confirmDelete()">確定刪除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://ruziacdggdfyvlbcjnan.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1emlhY2RnZ2RmeXZsYmNqbmFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NzE1OTEsImV4cCI6MjEwMDQ0NzU5MX0.3P7SzY2EfKtUTcuaBB0fMY0FOIdp_X3KmkfRnL8wuSg';

// 登入保護
(function checkAuth() {
  const saved = localStorage.getItem('ctr-auth') || sessionStorage.getItem('ctr-auth');
  if (!saved) { window.location.replace('index.html'); return; }
  try {
    const auth = JSON.parse(saved);
    if (!auth || !auth.username) throw new Error('invalid');
    window._currentUser = auth.username;
  } catch(e) {
    window.location.replace('index.html');
  }
})();

let rawRows = [];       // 原始資料（每筆是一個 name+location 組合）
let grouped = [];        // 依 name 分組後的結構 [{name, address, locations:[{id,location,seal_start}]}]
let pendingDelete = null; // {type:'location'|'consignee', id, name}
let editingLocId = null;
let editingLocName = null;

async function loadConsignees() {
  try {
    const res = await fetch(`${SB_URL}/rest/v1/consignees?select=*&order=name.asc,location.asc`, {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    if (!res.ok) throw new Error('連線失敗');
    rawRows = await res.json();
    groupData();
    render();
  } catch(e) {
    document.getElementById('list').innerHTML = '<div class="empty">⚠️ 載入失敗，請檢查網路連線</div>';
  }
}

function groupData() {
  const map = {};
  rawRows.forEach(r => {
    if (!map[r.name]) {
      map[r.name] = { name: r.name, address: r.address || '', taxId: r.tax_id || '', contactInfo: r.contact_info || '', shortName: r.short_name || '', chineseName: r.chinese_name || '', locations: [] };
    }
    map[r.name].locations.push({ id: r.id, location: r.location, seal_start: r.seal_start, unit: r.unit });
    if (r.address) map[r.name].address = r.address;
    if (r.tax_id) map[r.name].taxId = r.tax_id;
    if (r.contact_info) map[r.name].contactInfo = r.contact_info;
    if (r.short_name) map[r.name].shortName = r.short_name;
    if (r.chinese_name) map[r.name].chineseName = r.chinese_name;
  });
  grouped = Object.values(map);
}

function render() {
  const listEl = document.getElementById('list');
  if (!grouped.length) {
    listEl.innerHTML = `<div class="empty">
      <div class="ico">📇</div>
      尚未有收貨人資料<br>
      <span style="font-size:.78rem">點右下角「＋」新增第一筆</span>
    </div>`;
    return;
  }

  listEl.innerHTML = grouped.map(g => `
    <div class="consignee-card">
      <div class="cc-header">
        <div style="flex:1;min-width:0">
          <div class="cc-name">${escapeHtml(g.chineseName || g.name)}</div>
          <div style="font-size:.75rem;color:#777;margin-top:2px">英文名稱：${escapeHtml(g.name)}</div>
          ${g.address ? `<div class="cc-address">${escapeHtml(g.address)}</div>` : '<div class="cc-address" style="color:#cc8800">尚未設定地址</div>'}
          <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:.72rem;color:#888888">
            ${g.shortName ? `<span>簡稱：<b style="color:#555">${escapeHtml(g.shortName)}</b></span>` : ''}
            ${g.taxId ? `<span>統編：<b style="color:#555">${escapeHtml(g.taxId)}</b></span>` : ''}
            ${g.contactInfo ? `<span>聯絡人：<b style="color:#555">${escapeHtml(g.contactInfo).replace(/\n/g,' / ')}</b></span>` : ''}
          </div>
        </div>
        <button class="cc-header-btn" onclick="openEditConsignee('${escapeAttr(g.name)}')">編輯</button>
      </div>
      ${g.locations.map(loc => `
        <div class="loc-row">
          <div class="loc-info">卸存地：<b>${escapeHtml(loc.location)}</b> ・ 艙號起始：<b>${loc.seal_start}</b> ・ 單位：<b>${loc.unit || 'PKG'}</b></div>
          <div class="loc-actions">
            <button class="loc-btn loc-btn-edit" onclick="openEditLocation('${loc.id}','${escapeAttr(g.name)}')">編輯</button>
            <button class="loc-btn loc-btn-del" onclick="askDeleteLocation('${loc.id}','${escapeAttr(g.name)}','${escapeAttr(loc.location)}')">刪除</button>
          </div>
        </div>
      `).join('')}
      <button class="add-loc-btn" onclick="openAddLocation('${escapeAttr(g.name)}')">＋ 新增卸存地</button>
    </div>`).join('');
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}
function escapeAttr(s) {
  return (s || '').replace(/'/g, "\\'");
}

function closeDlg(id) {
  document.getElementById(id).classList.remove('show');
}

/* ══ ADD NEW CONSIGNEE (with first location) ══ */
function openAddConsignee() {
  document.getElementById('nc-name').value = '';
  document.getElementById('nc-chinesename').value = '';
  document.getElementById('nc-address').value = '';
  document.getElementById('nc-location').value = '';
  document.getElementById('nc-seal').value = '';
  document.getElementById('nc-unit').value = 'PKG';
  document.getElementById('nc-error').textContent = '';
  document.getElementById('dlg-add-consignee').classList.add('show');
}

async function submitNewConsignee() {
  const name = document.getElementById('nc-name').value.trim();
  const chineseName = document.getElementById('nc-chinesename').value.trim();
  const address = document.getElementById('nc-address').value.trim();
  const taxId = document.getElementById('nc-taxid').value.trim();
  const contactInfo = document.getElementById('nc-contact').value.trim();
  const shortName = document.getElementById('nc-shortname').value.trim();
  const location = document.getElementById('nc-location').value.trim().toUpperCase();
  const seal = document.getElementById('nc-seal').value.trim();
  const unit = document.getElementById('nc-unit').value;
  const errEl = document.getElementById('nc-error');
  const btnEl = document.getElementById('nc-submit');

  if (!name) { errEl.textContent = '請輸入收貨人名稱'; return; }
  if (!location) { errEl.textContent = '請輸入卸存地'; return; }
  if (!seal || isNaN(parseInt(seal))) { errEl.textContent = '請輸入有效的艙號起始值'; return; }

  errEl.textContent = '';
  btnEl.textContent = '儲存中…';
  btnEl.disabled = true;

  try {
    const res = await fetch(`${SB_URL}/rest/v1/consignees`, {
      method: 'POST',
      headers: {
        'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json', 'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ name, chinese_name: chineseName, address, tax_id: taxId, contact_info: contactInfo, short_name: shortName, location, seal_start: parseInt(seal), unit })
    });
    if (!res.ok) {
      const errText = await res.text();
      if (errText.includes('duplicate') || errText.includes('unique')) {
        throw new Error('這個收貨人在此卸存地的資料已經存在');
      }
      throw new Error(errText);
    }

    closeDlg('dlg-add-consignee');
    await loadConsignees();
    toast('✅ 已新增收貨人');
  } catch(e) {
    errEl.textContent = '儲存失敗：' + (e.message || '請稍後再試');
  } finally {
    btnEl.textContent = '儲存';
    btnEl.disabled = false;
  }
}

/* ══ EDIT CONSIGNEE (name + address, applies to all rows with that name) ══ */
function openEditConsignee(name) {
  const g = grouped.find(x => x.name === name);
  if (!g) return;
  editingLocName = name;
  document.getElementById('ec-name').value = g.name;
  document.getElementById('ec-chinesename').value = g.chineseName || '';
  document.getElementById('ec-address').value = g.address;
  document.getElementById('ec-taxid').value = g.taxId || '';
  document.getElementById('ec-contact').value = g.contactInfo || '';
  document.getElementById('ec-shortname').value = g.shortName || '';
  document.getElementById('ec-error').textContent = '';
  document.getElementById('dlg-edit-consignee').classList.add('show');
}

async function submitEditConsignee() {
  const newName = document.getElementById('ec-name').value.trim();
  const newChineseName = document.getElementById('ec-chinesename').value.trim();
  const newAddress = document.getElementById('ec-address').value.trim();
  const newTaxId = document.getElementById('ec-taxid').value.trim();
  const newContact = document.getElementById('ec-contact').value.trim();
  const newShortName = document.getElementById('ec-shortname').value.trim();
  const errEl = document.getElementById('ec-error');
  const btnEl = document.getElementById('ec-submit');

  if (!newName) { errEl.textContent = '請輸入收貨人名稱'; return; }

  errEl.textContent = '';
  btnEl.textContent = '儲存中…';
  btnEl.disabled = true;

  try {
    // 更新所有屬於這個收貨人（原名稱）的資料列
    const g = grouped.find(x => x.name === editingLocName);
    for (const loc of g.locations) {
      const res = await fetch(`${SB_URL}/rest/v1/consignees?id=eq.${loc.id}`, {
        method: 'PATCH',
        headers: {
          'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
          'Content-Type': 'application/json', 'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ name: newName, chinese_name: newChineseName, address: newAddress, tax_id: newTaxId, contact_info: newContact, short_name: newShortName })
      });
      if (!res.ok) throw new Error(await res.text());
    }

    closeDlg('dlg-edit-consignee');
    await loadConsignees();
    toast('✅ 已更新收貨人資訊');
  } catch(e) {
    errEl.textContent = '儲存失敗：' + (e.message || '請稍後再試');
  } finally {
    btnEl.textContent = '儲存';
    btnEl.disabled = false;
  }
}

/* ══ ADD/EDIT LOCATION within existing consignee ══ */
function openAddLocation(name) {
  editingLocId = null;
  editingLocName = name;
  document.getElementById('loc-title').textContent = `新增卸存地 — ${name}`;
  document.getElementById('loc-location').value = '';
  document.getElementById('loc-seal').value = '';
  document.getElementById('loc-unit').value = 'PKG';
  document.getElementById('loc-error').textContent = '';
  document.getElementById('dlg-loc').classList.add('show');
}

function openEditLocation(id, name) {
  const g = grouped.find(x => x.name === name);
  const loc = g.locations.find(x => x.id === id);
  if (!loc) return;
  editingLocId = id;
  editingLocName = name;
  document.getElementById('loc-title').textContent = `編輯卸存地 — ${name}`;
  document.getElementById('loc-location').value = loc.location;
  document.getElementById('loc-seal').value = loc.seal_start;
  document.getElementById('loc-unit').value = loc.unit || 'PKG';
  document.getElementById('loc-error').textContent = '';
  document.getElementById('dlg-loc').classList.add('show');
}

async function submitLocation() {
  const location = document.getElementById('loc-location').value.trim().toUpperCase();
  const seal = document.getElementById('loc-seal').value.trim();
  const unit = document.getElementById('loc-unit').value;
  const errEl = document.getElementById('loc-error');
  const btnEl = document.getElementById('loc-submit');

  if (!location) { errEl.textContent = '請輸入卸存地'; return; }
  if (!seal || isNaN(parseInt(seal))) { errEl.textContent = '請輸入有效的艙號起始值'; return; }

  errEl.textContent = '';
  btnEl.textContent = '儲存中…';
  btnEl.disabled = true;

  try {
    if (editingLocId) {
      const res = await fetch(`${SB_URL}/rest/v1/consignees?id=eq.${editingLocId}`, {
        method: 'PATCH',
        headers: {
          'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
          'Content-Type': 'application/json', 'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ location, seal_start: parseInt(seal), unit })
      });
      if (!res.ok) throw new Error(await res.text());
    } else {
      const g = grouped.find(x => x.name === editingLocName);
      const res = await fetch(`${SB_URL}/rest/v1/consignees`, {
        method: 'POST',
        headers: {
          'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
          'Content-Type': 'application/json', 'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ name: g.name, address: g.address, location, seal_start: parseInt(seal) })
      });
      if (!res.ok) {
        const errText = await res.text();
        if (errText.includes('duplicate') || errText.includes('unique')) {
          throw new Error('這個卸存地已經存在');
        }
        throw new Error(errText);
      }
    }

    closeDlg('dlg-loc');
    await loadConsignees();
    toast(editingLocId ? '✅ 已更新卸存地' : '✅ 已新增卸存地');
  } catch(e) {
    errEl.textContent = '儲存失敗：' + (e.message || '請稍後再試');
  } finally {
    btnEl.textContent = '儲存';
    btnEl.disabled = false;
  }
}

/* ══ DELETE ══ */
function askDeleteLocation(id, name, location) {
  pendingDelete = { type: 'location', id };
  document.getElementById('delete-title').textContent = '🗑 刪除卸存地';
  document.getElementById('delete-text').textContent = `確定要刪除「${name}」在「${location}」的資料嗎？`;
  document.getElementById('dlg-delete').classList.add('show');
}

async function confirmDelete() {
  if (!pendingDelete) return;
  const { id } = pendingDelete;
  closeDlg('dlg-delete');

  try {
    const res = await fetch(`${SB_URL}/rest/v1/consignees?id=eq.${id}`, {
      method: 'DELETE',
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    if (!res.ok) throw new Error('刪除失敗');
    await loadConsignees();
    toast('🗑 已刪除');
  } catch(e) {
    toast('⚠️ 刪除失敗，請稍後再試', true);
  }
  pendingDelete = null;
}

/* ══ TOAST ══ */
function toast(msg, warn=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (warn ? ' warn' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2400);
}

loadConsignees();
</script>
