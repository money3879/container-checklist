<!DOCTYPE html>
<html lang="zh-TW" style="background:#ffffff;color-scheme:light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>匯入並產生艙單</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --cyan:  #1a7bbf;
  --amber: #c07000;
  --red:   #cc2222;
  --green: #2e9e5b;
  --txt:   #111111;
  --txt2:  #444444;
  --mono: 'SF Mono','Menlo','Consolas','Courier New',monospace;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent }
html, body { overflow-x:hidden; font-size:16px }
body {
  background:#ffffff !important; color:#111111 !important;
  font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}

#top {
  position:sticky; top:0; z-index:200;
  background:#f2f4f6; border-bottom:2px solid var(--cyan);
  padding:10px 14px;
}
.bar1 { display:flex; align-items:center; justify-content:space-between; gap:8px }
.app-title { font-size:.95rem; font-weight:900; letter-spacing:2px; color:#1a5a8a }
.tbtn {
  border:1px solid rgba(0,0,0,.2); border-radius:6px; padding:7px 12px;
  font-size:.78rem; font-weight:700; cursor:pointer; font-family:inherit;
  background:#ffffff; color:#333333; white-space:nowrap;
}

main { padding:16px; padding-bottom:40px; max-width:960px; margin:0 auto }

.step-section {
  background:#ffffff; border:1px solid rgba(0,0,0,.12); border-radius:12px;
  padding:16px; margin-bottom:14px;
}
.step-header { display:flex; align-items:center; gap:8px; margin-bottom:14px }
.step-num {
  width:24px; height:24px; border-radius:50%; background:var(--cyan); color:#fff;
  font-size:.75rem; font-weight:800; display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.step-title { font-size:.88rem; font-weight:800; color:var(--txt) }

.field { margin-bottom:12px }
.field label {
  display:block; font-size:.72rem; font-weight:700; color:#444444;
  letter-spacing:.5px; margin-bottom:6px;
}
.field input, .field select {
  width:100%; padding:10px 12px; border:1.5px solid rgba(0,0,0,.15);
  border-radius:8px; font-size:.88rem; font-family:inherit; color:#111111;
  outline:none; background:#ffffff;
}
.field input:focus, .field select:focus { border-color:var(--cyan) }
.field-row { display:grid; grid-template-columns:1fr 1fr; gap:10px }
.field-row .field { margin-bottom:0; min-width:0 }
.field-row .field input { width:100%; min-width:0; box-sizing:border-box }
.field-row .field input[type="date"] { font-size:.82rem; padding:10px 8px }

@media (max-width:400px) {
  .field-row { grid-template-columns:1fr }
}
.field-hint { font-size:.68rem; color:#999999; margin-top:4px }

.ship-preview {
  background:#f8f9fa; border-radius:8px; padding:10px 12px; margin-top:8px;
  font-size:.76rem; color:#555555; line-height:1.7; display:none;
}
.ship-preview.show { display:block }
.ship-preview b { color:var(--cyan) }

.loc-card {
  border:1.5px solid rgba(0,0,0,.12); border-radius:10px; padding:12px;
  margin-bottom:10px; background:#fafbfc;
}
.loc-card-row { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap }
.loc-card-field { flex:1 1 160px; min-width:0 }
.loc-card-field label {
  display:block; font-size:.68rem; font-weight:700; color:#666666;
  margin-bottom:5px; letter-spacing:.3px;
}
.loc-card-field input, .loc-card-field select {
  width:100%; min-width:0; padding:9px 10px; border:1.5px solid rgba(0,0,0,.15);
  border-radius:7px; font-size:.85rem; font-family:inherit; color:#111111;
  outline:none; background:#ffffff; box-sizing:border-box;
}
.loc-card-field input:focus, .loc-card-field select:focus { border-color:var(--cyan) }
.loc-remove-btn {
  border:1.5px solid rgba(204,34,34,.3); background:#fdf0ef; color:var(--red);
  font-size:.78rem; font-weight:700; cursor:pointer; padding:9px 14px;
  border-radius:7px; white-space:nowrap; font-family:inherit; flex-shrink:0;
}
.loc-add-btn {
  width:100%; padding:9px; border:1.5px dashed rgba(0,0,0,.2); border-radius:7px;
  background:none; color:var(--cyan); font-size:.78rem; font-weight:700;
  cursor:pointer; font-family:inherit; margin-top:4px;
}

.dzone {
  border:2px dashed rgba(0,0,0,.15); border-radius:10px; padding:28px 16px;
  text-align:center; cursor:pointer; transition:all .2s; margin-bottom:8px;
}
.dzone:hover, .dzone.drag-over { border-color:var(--cyan); background:rgba(26,123,191,.04) }
.dzone .di { font-size:1.8rem; margin-bottom:6px }
.dzone p { font-size:.8rem; color:#666666; margin:0 }
.dzone strong { color:var(--cyan) }
input[type="file"] { display:none }

.file-loaded {
  display:none; align-items:center; gap:10px; padding:12px 14px;
  background:#eef7ee; border:1px solid rgba(46,158,91,.3); border-radius:8px;
  font-size:.82rem; color:#1a7a3e; margin-bottom:8px;
}
.file-loaded.show { display:flex }

.btn-primary {
  width:100%; padding:13px; background:var(--cyan); color:#fff; border:none;
  border-radius:8px; font-size:.9rem; font-weight:800; cursor:pointer; font-family:inherit;
}
.btn-primary:disabled { background:#cccccc; cursor:not-allowed }

.error-box {
  background:#fdf0ef; border:1px solid rgba(204,34,34,.3); border-radius:8px;
  padding:12px 14px; margin-top:10px; font-size:.8rem; color:var(--red); line-height:1.6;
  display:none;
}
.error-box.show { display:block }
.error-box ul { margin:6px 0 0 18px }

#preview-section { display:none }
#preview-section.show { display:block }

.loc-tabs { display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; flex-wrap:wrap }
.loc-tab {
  padding:8px 14px; border-radius:8px; border:1.5px solid rgba(0,0,0,.15);
  background:#ffffff; color:#555555; font-size:.8rem; font-weight:700;
  cursor:pointer; white-space:nowrap; font-family:inherit;
}
.loc-tab.active { border-color:var(--cyan); background:rgba(26,123,191,.08); color:var(--cyan) }

.view-toggle { display:flex; gap:6px; margin-bottom:14px }
.view-btn {
  flex:1; padding:9px; border:1.5px solid rgba(0,0,0,.15); border-radius:8px;
  background:#ffffff; color:#555555; font-size:.78rem; font-weight:700;
  cursor:pointer; font-family:inherit;
}
.view-btn.active { border-color:var(--cyan); background:rgba(26,123,191,.08); color:var(--cyan) }

.preview-stats { display:flex; gap:16px; margin-bottom:12px; font-size:.82rem; color:#444444; flex-wrap:wrap }
.preview-stats b { color:var(--cyan); font-size:1rem }

.table-scroll { overflow-x:auto; border:1px solid rgba(0,0,0,.12); border-radius:8px }
table.tbl-view { width:100%; border-collapse:collapse; font-size:.72rem; min-width:900px }
table.tbl-view thead th {
  background:#e8ecf0; color:#222222; font-weight:800; padding:8px 6px; text-align:left;
  white-space:nowrap; border-bottom:2px solid var(--cyan); position:sticky; top:0;
}
table.tbl-view td {
  padding:7px 6px; border-bottom:1px solid rgba(0,0,0,.08); color:#111111;
  white-space:nowrap; max-width:220px; overflow:hidden; text-overflow:ellipsis;
}
table.tbl-view tbody tr:nth-child(even) { background:#f8f9fa }
.cell-mono { font-family:var(--mono) }
.cell-wide { white-space:normal !important; max-width:280px }

.excel-view-wrap { overflow-x:auto; border:1px solid rgba(0,0,0,.2); border-radius:4px }
table.excel-view { border-collapse:collapse; font-size:.68rem; font-family:'PingFang TC','Microsoft JhengHei',var(--mono); min-width:1050px }
table.excel-view td, table.excel-view th {
  border:1px solid #666666; padding:5px 6px; white-space:pre-wrap; vertical-align:middle;
  font-size:.66rem; text-align:center; line-height:1.4;
}
table.excel-view th { background:#e2e9f0; font-weight:700; text-align:center; font-size:.62rem }
table.excel-view tbody:first-of-type td { text-align:center; font-size:.68rem }

.export-bar { display:flex; gap:10px; margin-top:16px }
.btn-export {
  flex:1; padding:13px; background:var(--green); color:#fff; border:none;
  border-radius:8px; font-size:.9rem; font-weight:800; cursor:pointer; font-family:inherit;
}
.btn-back {
  padding:13px 18px; background:none; border:1px solid rgba(0,0,0,.2);
  border-radius:8px; font-size:.85rem; color:#555555; cursor:pointer; font-family:inherit;
}
</style>
</head>
<body>

<div id="top">
  <div class="bar1">
    <span class="app-title">📥 匯入並產生艙單</span>
    <button class="tbtn" onclick="location.href='manifest.html'">← 返回艙單系統</button>
  </div>
</div>

<main>

  <div class="step-section">
    <div class="step-header">
      <div class="step-num">1</div>
      <div class="step-title">船舶與航次資訊</div>
    </div>

    <div class="field">
      <label>選擇一程船（從大陸進口）*</label>
      <select id="f-ship-select" onchange="onShipSelect()">
        <option value="">請選擇一程船…</option>
      </select>
      <div class="ship-preview" id="ship-preview"></div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>航次 *</label>
        <input type="text" id="f-voyage" placeholder="例如 260727">
      </div>
      <div class="field">
        <label>船隻掛號 *</label>
        <input type="text" id="f-registration" placeholder="例如 15PAHD" oninput="this.value=this.value.toUpperCase()">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>到港日期 *</label>
        <input type="date" id="f-arrival-date">
      </div>
      <div class="field">
        <label>繫泊日期 *</label>
        <input type="date" id="f-mooring-date">
      </div>
    </div>
  </div>

  <div class="step-section">
    <div class="step-header">
      <div class="step-num">2</div>
      <div class="step-title">卸存地</div>
    </div>
    <div id="loc-list"></div>
    <button class="loc-add-btn" onclick="addLocationInput()">＋ 新增卸存地</button>
  </div>

  <div class="step-section">
    <div class="step-header">
      <div class="step-num">3</div>
      <div class="step-title">上傳原始 Excel</div>
    </div>

    <div class="dzone" id="dzone" onclick="document.getElementById('fi').click()"
      ondragover="dOver(event)" ondragleave="dLeave()" ondrop="dDrop(event)">
      <div class="di">📂</div>
      <p>點此選檔案<br><strong>或拖曳 Excel 到此</strong></p>
    </div>
    <input type="file" id="fi" accept=".xlsx,.xls,.csv" onchange="fileSel(this)">

    <div class="file-loaded" id="file-loaded">
      <span>✅</span>
      <span id="file-loaded-text"></span>
    </div>
  </div>

  <button class="btn-primary" id="btn-generate" onclick="generatePreview()">產生艙單預覽</button>

  <div class="error-box" id="error-box"></div>

  <div id="preview-section">
    <div class="step-section" style="margin-top:14px">
      <div class="step-header">
        <div class="step-num">4</div>
        <div class="step-title">艙單預覽</div>
      </div>

      <div class="loc-tabs" id="loc-tabs"></div>

      <div class="view-toggle">
        <button class="view-btn active" id="view-btn-table" onclick="switchView('table')">📋 表格檢視</button>
        <button class="view-btn" id="view-btn-excel" onclick="switchView('excel')">📑 艙單版面檢視</button>
      </div>

      <div class="preview-stats">
        <span>共 <b id="stat-total">0</b> 筆貨物</span>
        <span>艙號範圍 <b id="stat-range">—</b></span>
      </div>

      <div id="view-table">
        <div class="table-scroll">
          <table class="tbl-view">
            <thead>
              <tr>
                <th>主提單號碼</th><th>艙單號碼</th><th>件數</th><th>單位</th>
                <th>標記/追蹤號</th><th>貨名</th><th>毛重</th>
                <th>收貨人簡稱</th><th>收貨人資訊</th>
              </tr>
            </thead>
            <tbody id="preview-tbody"></tbody>
          </table>
        </div>
      </div>

      <div id="view-excel" style="display:none">
        <div class="excel-view-wrap">
          <table class="excel-view" id="excel-preview-table"></table>
        </div>
      </div>

      <div class="export-bar">
        <button class="btn-back" onclick="backToEdit()">← 返回修改</button>
        <button class="btn-export" onclick="exportManifest()">📤 匯出目前卸存地的艙單 Excel</button>
      </div>
    </div>
  </div>

</main>

(function checkAuth() {
  const saved = localStorage.getItem('ctr-auth') || sessionStorage.getItem('ctr-auth');
  if (!saved) { window.location.replace('index.html'); return; }
  try {
    const auth = JSON.parse(saved);
    if (!auth || !auth.username) throw new Error('invalid');
    window._currentUser = auth.username;
  } catch(e) {
    window.location.replace('index.html');
  }
})();

let ships = [];
let consignees = [];
let uploadedRows = null;
let manifestByLocation = {};
let currentLocationTab = null;
let currentView = 'table';

const CONTAINER_TYPE_MAP = { '40HC': '45G1', '20GP': '22G1' };

async function init() {
  try {
    const [shipsRes, consigneesRes] = await Promise.all([
      fetch(`${SB_URL}/rest/v1/ships?select=*&order=ship_name.asc`, {
        headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
      }),
      fetch(`${SB_URL}/rest/v1/consignees?select=*`, {
        headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
      })
    ]);
    ships = await shipsRes.json();
    consignees = await consigneesRes.json();

    const sel = document.getElementById('f-ship-select');
    ships.filter(s => (s.ship_type || '一程船') === '一程船').forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = s.ship_name;
      sel.appendChild(opt);
    });
  } catch(e) {
    console.error('初始化載入失敗', e);
  }
  addLocationInput();
}

function onShipSelect() {
  const id = document.getElementById('f-ship-select').value;
  const preview = document.getElementById('ship-preview');
  if (!id) { preview.classList.remove('show'); return; }
  const s = ships.find(x => x.id === id);
  if (!s) return;
  preview.innerHTML = `
    <div style="margin-bottom:4px">船舶呼號：<b>${s.call_sign || '—'}</b></div>
    <div style="margin-bottom:4px">船長姓名：<b>${s.captain_name || '—'}</b></div>
    <div>總/淨噸數：<b>${s.gross_net_tonnage || '—'}</b></div>`;
  preview.classList.add('show');
}

let locCounter = 0;
function addLocationInput(value) {
  locCounter++;
  const id = `loc-input-${locCounter}`;
  const wrap = document.createElement('div');
  wrap.className = 'loc-card';
  wrap.id = `wrap-${id}`;

  wrap.innerHTML = `
    <div class="loc-card-row">
      <div class="loc-card-field">
        <label>卸存地</label>
        <input type="text" id="${id}" placeholder="例如 KHH0638S" style="text-transform:uppercase" value="${value||''}">
      </div>
      <div class="loc-card-field">
        <label>二程船（回台灣）</label>
        <input type="text" id="${id}-ship2" placeholder="例如 大佑輪">
      </div>
      <button class="loc-remove-btn" onclick="removeLocationInput('${id}')">🗑 刪除</button>
    </div>
  `;
  document.getElementById('loc-list').appendChild(wrap);
}
function removeLocationInput(id) {
  const wrap = document.getElementById(`wrap-${id}`);
  if (wrap) wrap.remove();
}
function getLocationInputs() {
  const wraps = Array.from(document.querySelectorAll('.loc-card'));
  return wraps.map(wrap => {
    const locInput = wrap.querySelector('input[id]:not([id$="-ship2"])');
    const ship2Input = wrap.querySelector('input[id$="-ship2"]');
    return {
      location: locInput.value.trim().toUpperCase(),
      ship2Name: ship2Input.value.trim()
    };
  }).filter(x => x.location);
}

function dOver(e) { e.preventDefault(); document.getElementById('dzone').classList.add('drag-over'); }
function dLeave() { document.getElementById('dzone').classList.remove('drag-over'); }
function dDrop(e) { e.preventDefault(); dLeave(); if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); }
function fileSel(inp) { if (inp.files[0]) readFile(inp.files[0]); }

function readFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'binary' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, { defval: '' });
      if (!json.length) { showError(['檔案沒有資料']); return; }
      uploadedRows = json;
      document.getElementById('file-loaded-text').textContent = `已載入 ${file.name}（共 ${json.length} 筆資料）`;
      document.getElementById('file-loaded').classList.add('show');
    } catch(err) {
      showError(['檔案讀取失敗，請確認格式是否正確']);
    }
  };
  reader.readAsBinaryString(file);
}

function showError(msgs) {
  const box = document.getElementById('error-box');
  box.innerHTML = '⚠️ 無法產生艙單：<ul>' + msgs.map(m => `<li>${m}</li>`).join('') + '</ul>';
  box.classList.add('show');
}
function clearError() { document.getElementById('error-box').classList.remove('show'); }

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}

function toRocDate(isoDate) {
  if (!isoDate) return '';
  const [y, m, d] = isoDate.split('-').map(Number);
  return `${y - 1911}/${m}/${d}`;
}

/* ══ 核心：產生艙單資料（依卸存地分組） ══ */
function generatePreview() {
  clearError();

  const shipId = document.getElementById('f-ship-select').value;
  const voyage = document.getElementById('f-voyage').value.trim();
  const registration = document.getElementById('f-registration').value.trim().toUpperCase();
  const arrivalDate = document.getElementById('f-arrival-date').value;
  const mooringDate = document.getElementById('f-mooring-date').value;
  const locationList = getLocationInputs();

  const missing = [];
  if (!shipId) missing.push('請選擇一程船');
  if (!voyage) missing.push('請輸入航次');
  if (!registration) missing.push('請輸入船隻掛號');
  if (!arrivalDate) missing.push('請輸入到港日期');
  if (!mooringDate) missing.push('請輸入繫泊日期');
  if (!locationList.length) missing.push('請至少輸入一個卸存地');
  locationList.forEach(l => {
    if (!l.ship2Name) missing.push(`卸存地「${l.location}」尚未輸入二程船`);
  });
  if (!uploadedRows) missing.push('請上傳原始 Excel 檔案');
  if (missing.length) { showError(missing); return; }

  const sample = uploadedRows[0];
  const keys = Object.keys(sample);
  const findKey = (patterns) => keys.find(k => patterns.some(p => k.includes(p)));

  const kBillNo     = findKey(['提单号', '提單號']);
  const kConsignee  = findKey(['收货人', '收貨人']);
  const kIntlCode   = findKey(['国际码', '國際碼']);
  const kSeal       = findKey(['铅封号', '鉛封號']);
  const kPiecesTW   = findKey(['台湾件数', '台灣件數']);
  const kWeightTW   = findKey(['台湾重量', '台灣重量']);
  const kPieces     = findKey(['件数', '件數']);
  const kWeightRaw  = findKey(['毛重']);
  const kType       = findKey(['柜型', '櫃型']);
  const kLocation   = findKey(['卸存地']);

  const fieldErrors = [];
  if (!kBillNo)    fieldErrors.push('找不到「提单号」欄位');
  if (!kConsignee) fieldErrors.push('找不到「收货人」欄位');
  if (!kIntlCode)  fieldErrors.push('找不到「国际码」欄位');
  if (!kSeal)      fieldErrors.push('找不到「铅封号」欄位');
  if (!kType)      fieldErrors.push('找不到「柜型」欄位');
  if (!kLocation)  fieldErrors.push('找不到「卸存地」欄位（無法依卸存地過濾資料）');
  if (fieldErrors.length) { showError(fieldErrors); return; }

  // 依提單號排序（先排序，確保艙號分配順序正確）
  const sorted = [...uploadedRows].sort((a, b) => {
    const av = String(a[kBillNo] || ''), bv = String(b[kBillNo] || '');
    return av.localeCompare(bv, undefined, { numeric: true });
  });

  const notFound = new Set();
  manifestByLocation = {};

  const locationCodes = locationList.map(l => l.location);
  locationList.forEach(l => {
    manifestByLocation[l.location] = { items: [], ship2Name: l.ship2Name };
  });

  const sealCounter = {}; // key: `${consigneeName}|${location}`

  for (const row of sorted) {
    const rowLocation = String(row[kLocation] || '').trim().toUpperCase();
    if (!locationCodes.includes(rowLocation)) continue; // 不在本次要處理的卸存地清單裡，略過

    const consigneeName = String(row[kConsignee] || '').trim();
    const match = consignees.find(c => c.name.trim() === consigneeName && c.location === rowLocation);

    if (!match) {
      notFound.add(`${consigneeName}（卸存地：${rowLocation}）`);
      continue;
    }

    const counterKey = `${consigneeName}|${rowLocation}`;
    if (!(counterKey in sealCounter)) {
      sealCounter[counterKey] = match.seal_start;
    } else {
      sealCounter[counterKey]++;
    }
    const sealNo = sealCounter[counterKey];

    const billNo = String(row[kBillNo] || '').trim();
    const intlCode = String(row[kIntlCode] || '').trim();
    const sealNumRaw = row[kSeal];
    // 件數/毛重：優先用台灣件数/台灣重量，沒有值才用件数/毛重
    const pieces = (row[kPiecesTW] !== '' && row[kPiecesTW] != null) ? row[kPiecesTW] : (kPieces ? row[kPieces] : '');
    const weight = (row[kWeightTW] !== '' && row[kWeightTW] != null) ? row[kWeightTW] : (kWeightRaw ? row[kWeightRaw] : '');
    const containerType = String(row[kType] || '').trim();
    const mappedType = CONTAINER_TYPE_MAP[containerType] || containerType;

    const cargoDesc = `EXPRESS PACKAGE  ${intlCode}/${mappedType}/2/${sealNumRaw}`;
    const consigneeInfo = `收貨人:${consigneeName}\n${match.address || ''}`;
    const unit = match.unit || 'PKG';

    manifestByLocation[rowLocation].items.push({
      billNo, sealNo, pieces, unit,
      trackNo: intlCode, cargoDesc, weight,
      consigneeShort: consigneeName, consigneeInfo,
      taxId: match.tax_id || '',
      shortName: match.short_name || '',
      mappedType, sealNumRaw,
    });
  }

  if (notFound.size) {
    showError([
      '以下收貨人找不到對照資料，請先到「收貨人管理」新增：',
      ...Array.from(notFound).map(n => `<b>${n}</b>`)
    ]);
    return;
  }

  // 移除沒有任何資料的卸存地分頁
  Object.keys(manifestByLocation).forEach(loc => {
    if (!manifestByLocation[loc].items.length) delete manifestByLocation[loc];
  });

  if (!Object.keys(manifestByLocation).length) {
    showError(['沒有任何資料符合指定的卸存地，請確認輸入的卸存地是否正確']);
    return;
  }

  // 每個卸存地內部依艙號排序
  Object.values(manifestByLocation).forEach(loc => {
    loc.items.sort((a, b) => a.sealNo - b.sealNo);
  });

  // 儲存共用資訊
  const ship = ships.find(s => s.id === shipId);
  window._manifestMeta = { ship, voyage, registration, arrivalDate, mooringDate };

  currentLocationTab = Object.keys(manifestByLocation)[0];
  renderLocationTabs();
  renderPreview();
}

function renderLocationTabs() {
  const tabsEl = document.getElementById('loc-tabs');
  tabsEl.innerHTML = Object.keys(manifestByLocation).map(loc => `
    <button class="loc-tab ${loc === currentLocationTab ? 'active' : ''}" onclick="switchLocationTab('${loc}')">
      ${loc}（${manifestByLocation[loc].items.length}）
    </button>`).join('');
}

function switchLocationTab(loc) {
  currentLocationTab = loc;
  renderLocationTabs();
  renderPreview();
}

function switchView(view) {
  currentView = view;
  document.getElementById('view-btn-table').classList.toggle('active', view === 'table');

  document.getElementById('view-table').style.display = view === 'table' ? 'block' : 'none';

/* ══ 核心：以範本為基底匯出艙單 Excel ══ */
function b64ToArrayBuffer(b64) {
  const binStr = atob(b64);
  const len = binStr.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = binStr.charCodeAt(i);
  return bytes.buffer;
}

function exportManifest() {
  try {
    const meta = window._manifestMeta;
    const loc = currentLocationTab;
    const items = manifestByLocation[loc].items;

    const buf = b64ToArrayBuffer(TEMPLATE_B64);
    const srcWb = XLSX.read(buf, { type: 'array', cellStyles: true });

    const sheetName = '進口艙單印1份';
    if (!srcWb.Sheets[sheetName]) {
      alert('範本檔案裡找不到「進口艙單印1份」工作表，請確認範本是否正確');
      return;
    }
    const ws = srcWb.Sheets[sheetName];

    // ── 更新表頭資訊 ──
    setCellPreserveStyle(ws, 'D3', meta.ship.ship_name);
    setCellPreserveStyle(ws, 'F3', meta.voyage);
    setCellPreserveStyle(ws, 'H3', meta.ship.call_sign || '');
    setCellPreserveStyle(ws, 'K3', meta.ship.captain_name || '');
    setCellPreserveStyle(ws, 'N3', meta.registration);
    setCellPreserveStyle(ws, 'F6', meta.ship.gross_net_tonnage || '');
    setCellPreserveStyle(ws, 'K6', toRocDate(meta.arrivalDate));
    setCellPreserveStyle(ws, 'M6', toRocDate(meta.mooringDate));

    const TEMPLATE_ROW = 16;          // 資料列起始行
    const TEMPLATE_ROWS_BUILT = 3;    // 範本內建可直接使用的列數（16,17,18）
    const FIXED_ROWS_AFTER = 5;       // 資料列結束後，固定內容佔用的列數（合計、船長簽單、簽名列等）

    // 只有在資料筆數「超過」範本內建列數時，才需要複製新列與搬移固定區塊
    const extraRows = Math.max(0, items.length - TEMPLATE_ROWS_BUILT);

    if (extraRows > 0) {
      // 1) 先把「合計列以後」的固定內容完整搬到最終位置（由後往前搬，避免互相覆蓋）
      const oldFixedStart = TEMPLATE_ROW + TEMPLATE_ROWS_BUILT; // 原本合計列開始的位置
      const newFixedStart = TEMPLATE_ROW + items.length;         // 新的合計列開始位置
      moveRowBlock(ws, oldFixedStart, newFixedStart, FIXED_ROWS_AFTER);

      // 2) 在資料區塊裡新增列（複製 row 18 的樣式，包含框線、對齊、合併儲存格規則）
      for (let i = 0; i < extraRows; i++) {
        const newRow = TEMPLATE_ROW + TEMPLATE_ROWS_BUILT + i;
        copyRowComplete(ws, TEMPLATE_ROW + TEMPLATE_ROWS_BUILT - 1, newRow);
      }
    }

    // ── 填入每一筆資料 ──
    const taxIdShown = new Set();
    items.forEach((it, i) => {
      const row = TEMPLATE_ROW + i;
      setCellPreserveStyle(ws, `A${row}`, it.billNo);
      setCellPreserveStyle(ws, `B${row}`, it.sealNo);
      setCellPreserveStyle(ws, `C${row}`, it.pieces);
      setCellPreserveStyle(ws, `D${row}`, it.unit);
      setCellPreserveStyle(ws, `E${row}`, it.trackNo);
      setCellPreserveStyle(ws, `F${row}`, it.cargoDesc);
      setCellPreserveStyle(ws, `H${row}`, `R:${loc}\nT:KNH0010W\nL:CNXMN`);
      setCellPreserveStyle(ws, `I${row}`, it.weight);
      setCellPreserveStyle(ws, `K${row}`, 'KGS');
      setCellPreserveStyle(ws, `L${row}`, it.consigneeInfo);
      setCellPreserveStyle(ws, `P${row}`, it.remark || '(1)');
      setCellPreserveStyle(ws, `S${row}`, it.consigneeShort);
      setCellPreserveStyle(ws, `T${row}`, it.sealNumRaw);
      setCellPreserveStyle(ws, `U${row}`, 'SAME AS CONSIGNEE\n');
      if (!taxIdShown.has(it.consigneeShort)) {
        setCellPreserveStyle(ws, `V${row}`, it.taxId || '');
        taxIdShown.add(it.consigneeShort);
      } else {
        setCellPreserveStyle(ws, `V${row}`, '');
      }
      setCellPreserveStyle(ws, `W${row}`, it.shortName || '');
      setCellPreserveStyle(ws, `X${row}`, 'EXPRESS PACKAGE');
      setCellPreserveStyle(ws, `Z${row}`, it.mappedType);
      setCellPreserveStyle(ws, `AA${row}`, 2);
    });

    // 若資料筆數「少於」範本內建列數，清空多出來的空白列內容（保留格式）
    if (items.length < TEMPLATE_ROWS_BUILT) {
      for (let row = TEMPLATE_ROW + items.length; row < TEMPLATE_ROW + TEMPLATE_ROWS_BUILT; row++) {
        ['A','B','C','D','E','F','H','I','K','L','P','S','T','U','V','W','X','Z','AA'].forEach(col => {
          setCellPreserveStyle(ws, `${col}${row}`, '');
        });
      }
    }

    // ── 合計列 ──
    const totalRow = TEMPLATE_ROW + items.length;
    const totalPieces = items.reduce((sum, it) => sum + (parseInt(it.pieces) || 0), 0);
    const totalWeight = items.reduce((sum, it) => sum + (parseFloat(it.weight) || 0), 0);
    setCellPreserveStyle(ws, `A${totalRow}`, '合計');
    setCellPreserveStyle(ws, `C${totalRow}`, totalPieces);
    setCellPreserveStyle(ws, `D${totalRow}`, items[0] ? items[0].unit : 'PKG');
    setCellPreserveStyle(ws, `I${totalRow}`, totalWeight);

    // ── 更新工作表範圍 ──
    const range = XLSX.utils.decode_range(ws['!ref']);
    const newLastRow = totalRow + FIXED_ROWS_AFTER + 1;
    if (newLastRow - 1 > range.e.r) range.e.r = newLastRow - 1;
    ws['!ref'] = XLSX.utils.encode_range(range);

    // 清理無效的合併儲存格範圍（範圍必須在工作表邊界內，且起訖有效）
    if (ws['!merges']) {
      ws['!merges'] = ws['!merges'].filter(m =>
        m.s.r <= m.e.r && m.s.c <= m.e.c &&
        m.s.r >= 0 && m.s.c >= 0 &&
        m.e.r <= range.e.r && m.e.c <= range.e.c
      );
    }

    const outWb = XLSX.utils.book_new();
    outWb.SheetNames = [sheetName];
    outWb.Sheets[sheetName] = ws;

    const filename = `${meta.ship.ship_name}_${meta.voyage}_${loc}_艙單.xlsx`;
    XLSX.writeFile(outWb, filename);

  } catch(err) {
    alert('匯出失敗：' + err.message);
    console.error(err);
  }
}

/* ══ 樣式保留寫入：只換內容(v/t)，完整保留樣式索引(s) ══ */
function setCellPreserveStyle(ws, addr, value) {
  const existing = ws[addr];
  const style = existing ? existing.s : undefined;
  const isNum = typeof value === 'number';
  const isEmpty = value === '' || value == null;
  ws[addr] = {
    t: isEmpty ? 's' : (isNum ? 'n' : 's'),
    v: isEmpty ? '' : (isNum ? value : String(value)),
  };
  if (style !== undefined) ws[addr].s = style;
}

/* ══ 複製整列（含樣式、合併儲存格範圍、列高）到新的列 ══ */
function copyRowComplete(ws, srcRow, dstRow) {
  const range = XLSX.utils.decode_range(ws['!ref']);
  for (let c = range.s.c; c <= range.e.c; c++) {
    const srcAddr = XLSX.utils.encode_cell({ r: srcRow - 1, c });
    const dstAddr = XLSX.utils.encode_cell({ r: dstRow - 1, c });
    if (ws[srcAddr]) {
      const newCell = { t: 's', v: '' };
      if (ws[srcAddr].s !== undefined) newCell.s = ws[srcAddr].s;
      ws[dstAddr] = newCell;
    }
  }
  if (!ws['!rows']) ws['!rows'] = [];
  if (ws['!rows'][srcRow - 1]) {
    ws['!rows'][dstRow - 1] = { ...ws['!rows'][srcRow - 1] };
  }
  if (!ws['!merges']) ws['!merges'] = [];
  const srcMerges = ws['!merges'].filter(m => m.s.r === srcRow - 1 && m.e.r === srcRow - 1);
  srcMerges.forEach(m => {
    ws['!merges'].push({
      s: { r: dstRow - 1, c: m.s.c },
      e: { r: dstRow - 1, c: m.e.c },
    });
  });
}

/* ══ 把一段列區塊（含內容、樣式、合併儲存格）從 srcStart 整體搬到 dstStart ══
   一次性計算目標位置，不做多輪搬移，避免互相覆蓋導致資料損毀 */
function moveRowBlock(ws, srcStart, dstStart, rowCount) {
  if (srcStart === dstStart) return;
  const range = XLSX.utils.decode_range(ws['!ref']);
  const offset = dstStart - srcStart;

  // 先擷取來源區塊的所有內容（複製到暫存物件，避免搬移過程中被覆蓋）
  const snapshot = {};
  for (let r = srcStart; r < srcStart + rowCount; r++) {
    for (let c = range.s.c; c <= range.e.c; c++) {
      const addr = XLSX.utils.encode_cell({ r: r - 1, c });
      if (ws[addr]) {
        snapshot[addr] = ws[addr];
        delete ws[addr];
      }
    }
  }

  // 寫入目標位置
  Object.keys(snapshot).forEach(addr => {
    const decoded = XLSX.utils.decode_cell(addr);
    const newAddr = XLSX.utils.encode_cell({ r: decoded.r + offset, c: decoded.c });
    ws[newAddr] = snapshot[addr];
  });

  // 列高也要搬移
  if (ws['!rows']) {
    const rowSnapshot = {};
    for (let r = srcStart; r < srcStart + rowCount; r++) {
      if (ws['!rows'][r - 1]) {
        rowSnapshot[r] = ws['!rows'][r - 1];
        delete ws['!rows'][r - 1];
      }
    }
    Object.keys(rowSnapshot).forEach(r => {
      ws['!rows'][parseInt(r) - 1 + offset] = rowSnapshot[r];
    });
  }

  // 合併儲存格範圍：屬於這個區塊的，整體平移
  if (ws['!merges']) {
    ws['!merges'].forEach(m => {
      const r = m.s.r + 1;
      if (r >= srcStart && r < srcStart + rowCount) {
        m.s.r += offset;
        m.e.r += offset;
      }
    });
  }
}

function toRocDate(isoDate) {
  if (!isoDate) return '';
  const [y, m, d] = isoDate.split('-').map(Number);
  return `${y - 1911}/${m}/${d}`;
}
